[project]
name = "hackafterdark-nodes"
description = "Custom ComfyUI nodes featuring a film aspect ratio selector optimized for 1024x1024 models and a multi-modal Google Gemini prompter node."
version = "1.0.1"
license = "MIT"
requires-python = ">=3.8"
dependencies = ["pyyaml", "requests", "torch", "numpy", "Pillow", "google-generativeai"]

# classifiers = [
#     # For OS-independent nodes (works on all operating systems)
#     "Operating System :: OS Independent",
#
#     # OR for OS-specific nodes, specify the supported systems:
#     "Operating System :: Microsoft :: Windows",  # Windows specific
#     "Operating System :: POSIX :: Linux",  # Linux specific
#     "Operating System :: MacOS",  # macOS specific
#
#     # GPU Accelerator support. Pick the ones that are supported by your extension.
#     "Environment :: GPU :: NVIDIA CUDA",    # NVIDIA CUDA support
#     "Environment :: GPU :: AMD ROCm",       # AMD ROCm support
#     "Environment :: GPU :: Intel Arc",      # Intel Arc support
#     "Environment :: NPU :: Huawei Ascend",  # Huawei Ascend support
#     "Environment :: GPU :: Apple Metal",    # Apple Metal support
# ]

[project.urls]
Repository = "https://github.com/hackafterdark/ComfyUI-HackAfterDark-Nodes"
#  Used by Comfy Registry https://registry.comfy.org
Documentation = "https://github.com/hackafterdark/ComfyUI-HackAfterDark-Nodes/wiki"
"Bug Tracker" = "https://github.com/hackafterdark/ComfyUI-HackAfterDark-Nodes/issues"

[tool.comfy]
PublisherId = "hackafterdark"
DisplayName = "HackAfterDark Custom Nodes"
Icon = "https://raw.githubusercontent.com/hackafterdark/ComfyUI-HackAfterDark-Nodes/main/icon.png"
requires-comfyui = ">=1.0.0"